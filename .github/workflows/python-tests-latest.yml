name: 🧪 Test on QGIS DEV

on:
  workflow_dispatch:

jobs:
  # Run unit tests
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        qgis_version: [latest]
    env:
      QGIS_TEST_VERSION: ${{ matrix.qgis_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Test on QGIS
        run: |
          chmod +x runtests_docker.sh
          runtests_docker.sh -n auto

        # docker compose -f .docker/docker-compose.gh.yml run qgis /usr/src/runtests_docker.sh -n auto
