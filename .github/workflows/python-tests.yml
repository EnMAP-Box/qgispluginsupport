name: Linux Tests

on:
  workflow_run:
    workflows: [ "Code Checks" ]
    types: [ completed ]

  push:
    branches:
      # - 'master'
      - '**'
    paths:
      - '**.py'
      - '**.docker/**'

  pull_request:
    branches:
      - master
      - release-**

  release:
    types: [ published ]

jobs:
  # Run unit tests
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
         qgis_version: [ '4.2' ]
    name: QGIS ${{ matrix.qgis_version }}
    env:
      QGIS_TEST_VERSION: ${{ matrix.qgis_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Test on QGIS {{matrix.qgis_version}}
        run: |
          chmod +x .docker/runtests.sh 2>/dev/null || true
          docker compose -f .docker/docker-compose.gh.yml run --workdir /usr/src qgis /usr/src/runtests.sh -n auto
