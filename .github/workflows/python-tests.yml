name: Linux Tests

on:
  workflow_run:
    workflows: [ "Code Checks" ]
    types: [ completed ]

  push:
    branches:
      # - 'master'
      - '**'
    paths:
      - '**.py'
      - '**.docker/**'

  pull_request:
    branches:
      - master
      - release-**

  release:
    types: [ published ]

jobs:
  # Run unit tests
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
         qgis_version: [ '4.2' ]
    name: QGIS ${{ matrix.qgis_version }}
    env:
      QGIS_TEST_VERSION: ${{ matrix.qgis_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: System Info {{matrix.qgis_version}}
        run: |
          chmod +x .docker/docker-python.sh
          .docker/docker-python.sh runfirst.py
          .docker/docker-python.sh scripts/systeminfo.py

      - name: Test on QGIS {{matrix.qgis_version}}
        run: |
          chmod +x runtests_docker.sh
          ./runtests_docker.sh -n auto

        # docker compose -f .docker/docker-compose.gh.yml run qgis /usr/src/runtests_docker.sh -n auto
