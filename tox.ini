[coverage:run]

omit =
    qps/pyqtgraph/*


[flake8]

ignore =
# allow line break before binary operator
    W503,
# allow complex functions
    C901,
# experimental features
    QGS201,QGS202
# QGS403 Enum has been changed in Qt6.
    QGS403,

max-line-length = 120
max-complexity = 10

exclude =
    .git,
    deploy,
# There's no value in checking cache directories
    __pycache__,
    deploy,
    build, docs, test-reports, test-outputs, qgisresources

[pytest]
pythonpath =
    tests/qgispluginsupport

addopts =
    --maxfail=1 -rf
    --ignore=tests/_wip/
# --cov-config=.coveragec
# --cov qps
# --cov qps
norecursedirs =
    .*
    qpstestdata
    scripts
    test-outputs
    *.egg
    venv
# python_files =
# tests/layers/test_gdal_metadata.py
# tests/layers/test_layerconfigwidgets.py
# tests/layers/layer_properties.py
testpaths =
    tests/

# bandit]
# Exclude specific subfolders (comma-separated)
# exclude = ./qps/pyqtgraph
